[project]
name = "lavora"
dynamic = ["version"]
description = "Lavora - get your system working again."
requires-python = ">=3.12"
dependencies = ["cryptography>=42", "PySide6>=6.6"]

[project.scripts]
lavora-cli = "lavora.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "lavora.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py312"
extend-exclude = ["reference", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B905", "E741", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011", "SIM115", "B018"]
"tools/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/", "reference/", "build/", "dist/"]
